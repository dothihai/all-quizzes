<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(ellipse at 15% 25%, rgba(139, 92, 246, 0.45) 0%, transparent 52%),
                radial-gradient(ellipse at 85% 75%, rgba(79, 70, 229, 0.35) 0%, transparent 50%),
                linear-gradient(135deg, #0f0c29 0%, #302b63 55%, #1e0a3c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== MENU STYLES ===== */
        .menu-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .menu-header {
            text-align: center;
            color: white;
            padding: 52px 20px 36px;
        }

        .menu-header h1 {
            font-size: 2.8em;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .menu-header p {
            font-size: 1.05em;
            color: rgba(255, 255, 255, 0.6);
        }

        .quiz-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: transform 0.22s, box-shadow 0.22s, background 0.22s, border-color 0.22s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(167, 139, 250, 0.2);
        }

        .quiz-card-icon {
            font-size: 2em;
            margin-bottom: 16px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 14px;
        }

        .quiz-card-title {
            font-size: 1.0em;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .quiz-card-desc {
            font-size: 0.875em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .quiz-card-count {
            display: inline-block;
            font-size: 0.8em;
            color: #c4b5fd;
            font-weight: 600;
            background: rgba(167, 139, 250, 0.18);
            border-radius: 20px;
            padding: 4px 12px;
            border: 1px solid rgba(167, 139, 250, 0.35);
        }

        .quiz-card-ext-badge {
            display: inline-block;
            font-size: 0.78em;
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 3px 10px;
            margin-top: 4px;
        }

        .quiz-section-title {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 28px 0 8px;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.65);
        }

        .quiz-section-title::before {
            content: '';
            display: block;
            width: 3px;
            height: 16px;
            background: linear-gradient(180deg, #a78bfa, #7c3aed);
            border-radius: 3px;
            flex-shrink: 0;
        }

        .quiz-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .quiz-section-title:first-child {
            padding-top: 4px;
        }

        .menu-status {
            grid-column: 1 / -1;
            text-align: center;
            color: white;
            font-size: 1.1em;
            padding: 40px;
        }

        /* ===== QUIZ STYLES ===== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 60px rgba(0,0,0,0.45);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px 30px;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 16px;
            transition: background 0.2s;
        }

        .back-link:hover {
            background: rgba(255,255,255,0.35);
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
        }

        .quiz-content {
            padding: 30px;
        }

        .question-card {
            margin-bottom: 30px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #333;
            white-space: pre-wrap;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        .option input[type="radio"],
        .option input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .check-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .check-button:hover {
            background: #5568d3;
        }

        .check-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
        }

        .nav-right {
            display: flex;
            gap: 10px;
        }

        .question-jump-input {
            width: 70px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        .explain-button {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 16px;
            background: #10a37f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
        }

        .explain-button:hover {
            background: #0d8a6a;
        }

        .question-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fav-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 22px;
            line-height: 1;
            padding: 0;
            color: #ccc;
            transition: transform 0.15s, color 0.2s;
        }

        .fav-button:hover {
            transform: scale(1.15);
        }

        .fav-button.active {
            color: #f5b301;
        }

        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            flex-wrap: wrap;
            align-items: center;
        }

        .view-toggle-button {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .view-toggle-button:hover {
            background: #eef0fb;
        }

        .view-toggle-button.active {
            background: #667eea;
            color: white;
        }

        .nav-button {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .nav-button:hover:not(:disabled) {
            background: #5a6268;
        }

        .nav-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* ===== RESPONSIVE / MOBILE ===== */
        @media (max-width: 640px) {
            body { padding: 0; }
            .menu-wrapper { padding: 0 14px; }
            .container { border-radius: 0; }
            .header { padding: 12px 16px 18px; }
            .header h1 { font-size: 1.1em; margin-bottom: 4px; }
            .header > p { font-size: 0.8em; }
            .stats { padding: 10px 4px; gap: 0; }
            .stat-value { font-size: 18px; }
            .stat-label { font-size: 10px; }
            .quiz-content { padding: 14px 12px; }
            .question-text { font-size: 15px; }
            .option { padding: 10px 12px; font-size: 0.9em; }
            .navigation { padding: 10px 12px; gap: 6px; }
            .view-toggle { padding: 8px 12px; gap: 6px; }
        }

        /* Portrait mobile: nav buttons icon-only */
        @media (max-width: 480px) and (orientation: portrait) {
            .btn-text { display: none; }
            .nav-button { background: transparent; padding: 0; min-width: 44px; height: 44px; font-size: 0; display: inline-flex; align-items: center; justify-content: center; }
            .btn-icon { font-size: 2rem; line-height: 1; }
            .nav-button:active { transform: scale(0.88); background: transparent; }
            .nav-button:hover:not(:disabled) {
                background: transparent;
            }
            .nav-button:disabled {
                background: transparent;
                opacity: 0.4;
            }
        }

        /* @media (max-width: 380px) {
            .btn-text { display: none; }
            .nav-button { background: transparent; padding: 0; min-width: 44px; height: 44px; font-size: 0; display: inline-flex; align-items: center; justify-content: center; }
            .btn-icon { font-size: 2rem; line-height: 1; }
            .nav-button:active { transform: scale(0.88); background: transparent; }
            .nav-button:hover:not(:disabled) {
                background: transparent;
            }
            .nav-button:disabled {
                background: transparent;
                opacity: 0.4;
            }
        } */
    </style>
</head>
<body>

    <!-- ===== MENU SECTION ===== -->
    <div id="menu-section" style="display:none">
        <div class="menu-wrapper">
            <div class="menu-header">
                <h1>📚 Quiz Library</h1>
                <p>Chọn bộ câu hỏi để bắt đầu học</p>
            </div>
            <div id="quiz-list" class="quiz-list">
                <div class="menu-status">Đang tải danh sách bài học...</div>
            </div>
        </div>
    </div>

    <!-- ===== QUIZ SECTION ===== -->
    <div id="quiz-section" style="display:none">
        <div class="container">
            <div class="header">
                <div style="text-align:left">
                    <a href="./" class="back-link">← Danh sách bài học</a>
                </div>
                <h1 id="quiz-title"></h1>
                <p>Test your knowledge with practice questions</p>
            </div>

            <div class="view-toggle">
                <button class="view-toggle-button active" id="view-all-button" onclick="setViewMode('all')">All Questions</button>
                <button class="view-toggle-button" id="view-fav-button" onclick="setViewMode('favorites')">★ Favorites (<span id="fav-count">0</span>)</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="total-questions">0</div>
                    <div class="stat-label">Total Questions</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="correct-count">0</div>
                    <div class="stat-label">Correct</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="incorrect-count">0</div>
                    <div class="stat-label">Incorrect</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="accuracy">0%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
            </div>

            <div class="quiz-content">
                <div id="question-container">
                    <div class="question-card">
                        <div class="question-header">
                            <span class="question-header-left">
                                <span class="question-number" id="question-number">Question 1</span>
                                <button type="button" class="fav-button" id="fav-button" onclick="toggleFavorite()" title="Toggle favorite">☆</button>
                            </span>
                            <span class="question-progress">
                                <input type="number" id="question-jump" min="1" class="question-jump-input" />
                                <span> / <span id="question-total">0</span></span>
                            </span>
                        </div>
                        <div class="question-text" id="question-text"></div>
                        <div class="options" id="options-container"></div>
                        <button class="check-button" id="check-button" onclick="checkAnswer()">Check Answer</button>
                        <div class="result" id="result"></div>
                    </div>
                </div>
            </div>

            <div class="navigation">
                <button class="nav-button" id="prev-button" onclick="previousQuestion()"><span class="btn-icon">⬅️</span><span class="btn-text">&nbsp;Previous</span></button>
                <div class="nav-right">
                    <button class="nav-button" id="random-button" onclick="randomQuestion()" title="Câu ngẫu nhiên"><span class="btn-icon">🔀</span><span class="btn-text">&nbsp;Random</span></button>
                    <button class="nav-button" id="next-button" onclick="nextQuestion()"><span class="btn-text">Next&nbsp;</span><span class="btn-icon">➡️</span></button>
                    <button class="nav-button" id="last-button" onclick="lastQuestion()"><span class="btn-text">Last&nbsp;</span><span class="btn-icon">⏭️</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== ROUTER =====

        function getQuizIdFromUrl() {
            return new URLSearchParams(window.location.search).get('quiz');
        }

        window.addEventListener('load', function () {
            const quizId = getQuizIdFromUrl();
            if (quizId) {
                loadAndShowQuiz(quizId);
            } else {
                showMenu();
            }
        });

        // ===== MENU =====

        function showMenu() {
            document.getElementById('menu-section').style.display = '';
            document.getElementById('quiz-section').style.display = 'none';
            document.title = 'Quiz Library';
            loadMenuData();
        }

        async function loadMenuData() {
            const listEl = document.getElementById('quiz-list');
            try {
                const res = await fetch('quizzes.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const quizzes = await res.json();
                renderQuizCards(listEl, quizzes);
            } catch (e) {
                listEl.innerHTML = '<div class="menu-status">Không thể tải danh sách bài học.</div>';
            }
        }

        function renderCard(q) {
            const icon = q.icon || '📝';
            const desc = q.description || '';
            const title = escapeHtml(q.title);
            if (q.url) {
                const href = encodeURI(q.url);
                return `<a class="quiz-card" href="${href}" target="_blank" rel="noopener noreferrer">
                    <div class="quiz-card-icon">${icon}</div>
                    <div class="quiz-card-title">${title}</div>
                    <div class="quiz-card-desc">${escapeHtml(desc)}</div>
                    <div class="quiz-card-ext-badge">↗ liên kết ngoài</div>
                </a>`;
            }
            const countText = q.count != null ? q.count + ' câu hỏi' : '';
            const id = encodeURIComponent(q.id);
            return `<a class="quiz-card" href="?quiz=${id}">
                <div class="quiz-card-icon">${icon}</div>
                <div class="quiz-card-title">${title}</div>
                <div class="quiz-card-desc">${escapeHtml(desc)}</div>
                <div class="quiz-card-count">${escapeHtml(countText)}</div>
            </a>`;
        }

        function renderQuizCards(container, quizzes) {
            if (!quizzes || quizzes.length === 0) {
                container.innerHTML = '<div class="menu-status">Không có bài học nào.</div>';
                return;
            }
            // Group by category, preserving insertion order
            const groups = {};
            const order = [];
            quizzes.forEach(function (q) {
                const cat = q.category || '';
                if (!groups[cat]) { groups[cat] = []; order.push(cat); }
                groups[cat].push(q);
            });
            const hasCategories = order.some(function (c) { return c !== ''; });
            let html = '';
            order.forEach(function (cat) {
                if (hasCategories && cat) {
                    html += '<div class="quiz-section-title">' + escapeHtml(cat) + '</div>';
                }
                groups[cat].forEach(function (q) { html += renderCard(q); });
            });
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ===== QUIZ LOADER =====

        let currentQuizId = null;
        let allQuestions = [];
        let questions = [];
        let currentQuestionIndex = 0;
        let viewMode = 'all';
        let favorites = new Set();
        let stats = { correct: 0, incorrect: 0, answered: new Set() };

        function storageKey(suffix) {
            return 'quiz-' + currentQuizId + '-' + suffix;
        }

        function loadAndShowQuiz(quizId) {
            // Prevent path traversal
            if (!/^[a-zA-Z0-9_\-]+$/.test(quizId)) {
                showMenu();
                return;
            }

            currentQuizId = quizId;
            let questionsData = [];
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'questions/' + quizId + '.json', false);
                xhr.send(null);
                if (xhr.status === 200) {
                    const raw = JSON.parse(xhr.responseText);
                    questionsData = raw.map(function (q, idx) {
                        q.id = String(idx + 1);
                        return q;
                    });
                } else {
                    console.error('Failed to load quiz, status:', xhr.status);
                }
            } catch (err) {
                console.error('Failed to load quiz:', err);
            }

            document.getElementById('menu-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = '';

            // Set a preliminary title, then update once metadata loads
            document.title = quizId;
            document.getElementById('quiz-title').textContent = '🧪 ' + quizId;
            fetchQuizMeta(quizId);

            initQuiz(questionsData);
        }

        async function fetchQuizMeta(quizId) {
            try {
                const res = await fetch('quizzes.json');
                if (!res.ok) return;
                const quizzes = await res.json();
                const meta = quizzes.find(function (q) { return q.id === quizId; });
                if (meta && meta.title) {
                    document.title = meta.title;
                    document.getElementById('quiz-title').textContent = '🧪 ' + meta.title;
                }
            } catch (e) { /* ignore */ }
        }

        // ===== QUIZ LOGIC =====

        function initQuiz(questionsData) {
            allQuestions = questionsData;
            currentQuestionIndex = 0;
            viewMode = 'all';
            favorites = new Set();
            stats = { correct: 0, incorrect: 0, answered: new Set() };
            updateStats();

            try {
                const favRaw = localStorage.getItem(storageKey('favs'));
                if (favRaw) {
                    const arr = JSON.parse(favRaw);
                    if (Array.isArray(arr)) favorites = new Set(arr);
                }
            } catch (e) { /* ignore */ }

            try {
                const savedMode = localStorage.getItem(storageKey('view'));
                if (savedMode === 'favorites' || savedMode === 'all') viewMode = savedMode;
            } catch (e) { /* ignore */ }

            applyViewMode();

            try {
                const raw = localStorage.getItem(storageKey('pos'));
                if (raw !== null) {
                    const savedId = parseInt(raw, 10);
                    if (!isNaN(savedId)) {
                        const idx = questions.findIndex(function (q) { return parseInt(q.id, 10) === savedId; });
                        if (idx >= 0) currentQuestionIndex = idx;
                    }
                }
            } catch (e) { /* ignore */ }

            // Re-attach jump input listeners (clone to clear any old ones)
            const jumpInput = document.getElementById('question-jump');
            const newJump = jumpInput.cloneNode(true);
            jumpInput.parentNode.replaceChild(newJump, jumpInput);
            newJump.addEventListener('change', handleJump);
            newJump.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { handleJump(); newJump.blur(); }
            });

            updateFavCount();
            updateViewToggleButtons();
            displayQuestion();
        }

        function applyViewMode() {
            if (viewMode === 'favorites') {
                questions = allQuestions.filter(function (q) { return favorites.has(q.id); });
            } else {
                questions = allQuestions;
            }
            if (currentQuestionIndex >= questions.length) {
                currentQuestionIndex = Math.max(0, questions.length - 1);
            }
        }

        function setViewMode(mode) {
            if (mode === viewMode) return;
            const currentId = questions[currentQuestionIndex] && questions[currentQuestionIndex].id;
            viewMode = mode;
            try { localStorage.setItem(storageKey('view'), mode); } catch (e) { /* ignore */ }
            applyViewMode();
            if (currentId != null) {
                const idx = questions.findIndex(function (q) { return q.id === currentId; });
                currentQuestionIndex = idx >= 0 ? idx : 0;
            } else {
                currentQuestionIndex = 0;
            }
            updateViewToggleButtons();
            displayQuestion();
        }

        function updateViewToggleButtons() {
            document.getElementById('view-all-button').classList.toggle('active', viewMode === 'all');
            document.getElementById('view-fav-button').classList.toggle('active', viewMode === 'favorites');
        }

        function updateFavCount() {
            document.getElementById('fav-count').textContent = favorites.size;
        }

        function saveFavorites() {
            try {
                localStorage.setItem(storageKey('favs'), JSON.stringify(Array.from(favorites)));
            } catch (e) { /* ignore */ }
        }

        function toggleFavorite() {
            const question = questions[currentQuestionIndex];
            if (!question) return;
            if (favorites.has(question.id)) {
                favorites.delete(question.id);
            } else {
                favorites.add(question.id);
            }
            saveFavorites();
            updateFavCount();
            updateFavButton();
            if (viewMode === 'favorites') {
                const currentId = question.id;
                applyViewMode();
                const idx = questions.findIndex(function (q) { return q.id === currentId; });
                if (idx >= 0) {
                    currentQuestionIndex = idx;
                } else if (currentQuestionIndex >= questions.length) {
                    currentQuestionIndex = Math.max(0, questions.length - 1);
                }
                displayQuestion();
            }
        }

        function updateFavButton() {
            const btn = document.getElementById('fav-button');
            const question = questions[currentQuestionIndex];
            if (!question) {
                btn.textContent = '☆';
                btn.classList.remove('active');
                return;
            }
            const isFav = favorites.has(question.id);
            btn.textContent = isFav ? '★' : '☆';
            btn.classList.toggle('active', isFav);
        }

        function saveProgress() {
            const question = questions[currentQuestionIndex];
            if (!question) return;
            try { localStorage.setItem(storageKey('pos'), question.id); } catch (e) { /* ignore */ }
        }

        function handleJump() {
            const jumpInput = document.getElementById('question-jump');
            let val = parseInt(jumpInput.value, 10);
            if (isNaN(val)) { jumpInput.value = currentQuestionIndex + 1; return; }
            val = Math.max(1, Math.min(questions.length, val));
            currentQuestionIndex = val - 1;
            displayQuestion();
        }

        function lastQuestion() {
            currentQuestionIndex = questions.length - 1;
            displayQuestion();
        }

        function displayQuestion() {
            document.getElementById('total-questions').textContent = questions.length;
            document.getElementById('question-total').textContent = questions.length;
            const jumpInput = document.getElementById('question-jump');
            jumpInput.max = Math.max(1, questions.length);

            if (questions.length === 0) {
                document.getElementById('question-number').textContent = 'No questions';
                jumpInput.value = '';
                jumpInput.disabled = true;
                document.getElementById('question-text').textContent =
                    viewMode === 'favorites'
                        ? 'No favorite questions yet. Star a question to add it here.'
                        : 'No questions available.';
                document.getElementById('options-container').innerHTML = '';
                document.getElementById('check-button').disabled = true;
                document.getElementById('result').className = 'result';
                document.getElementById('prev-button').disabled = true;
                document.getElementById('next-button').disabled = true;
                document.getElementById('random-button').disabled = true;
                document.getElementById('last-button').disabled = true;
                updateFavButton();
                return;
            }
            jumpInput.disabled = false;

            const question = questions[currentQuestionIndex];
            document.getElementById('question-number').textContent = 'Question ' + question.id;
            jumpInput.value = currentQuestionIndex + 1;
            document.getElementById('question-text').textContent = question.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const isMultiple = question.correct_answer.length > 1;
            const inputType = isMultiple ? 'checkbox' : 'radio';
            for (const [key, value] of Object.entries(question.options)) {
                const option = document.createElement('label');
                option.className = 'option';
                const input = document.createElement('input');
                input.type = inputType;
                input.name = 'answer';
                input.value = key;
                const span = document.createElement('span');
                const strong = document.createElement('strong');
                strong.textContent = key + '.';
                span.appendChild(strong);
                span.appendChild(document.createTextNode(' ' + value));
                option.appendChild(input);
                option.appendChild(span);
                optionsContainer.appendChild(option);
            }

            document.getElementById('result').className = 'result';
            document.getElementById('check-button').disabled = false;
            document.getElementById('prev-button').disabled = currentQuestionIndex === 0;
            document.getElementById('random-button').disabled = questions.length <= 1;
            document.getElementById('next-button').disabled = currentQuestionIndex === questions.length - 1;
            document.getElementById('last-button').disabled = currentQuestionIndex === questions.length - 1;
            updateFavButton();
            saveProgress();
        }

        function checkAnswer() {
            const question = questions[currentQuestionIndex];
            const isMultiple = question.correct_answer.length > 1;
            let answer;
            if (isMultiple) {
                const checked = document.querySelectorAll('input[name="answer"]:checked');
                if (checked.length === 0) { alert('Please select an answer!'); return; }
                answer = Array.from(checked).map(function (cb) { return cb.value; }).sort().join('');
            } else {
                const selectedOption = document.querySelector('input[name="answer"]:checked');
                if (!selectedOption) { alert('Please select an answer!'); return; }
                answer = selectedOption.value;
            }
            const isCorrect = answer === question.correct_answer;

            if (!stats.answered.has(question.id)) {
                stats.answered.add(question.id);
                if (isCorrect) { stats.correct++; } else { stats.incorrect++; }
                updateStats();
            }

            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result show ' + (isCorrect ? 'correct' : 'incorrect');

            const baseMsg = isCorrect
                ? '✅ Correct! Well done!'
                : '❌ Incorrect. The correct answer is <strong>' + escapeHtml(question.correct_answer) + '</strong>';

            const optionsText = Object.entries(question.options)
                .map(function ([k, v]) { return k + '. ' + v; }).join('\n');
            const promptText = 'Dịch vào giải thích đáp án: ' + question.question + '\n' + optionsText + '\nĐáp án đúng: ' + question.correct_answer;
            const chatgptUrl = 'https://chatgpt.com/?prompt=' + encodeURIComponent(promptText);
            resultDiv.innerHTML = baseMsg + '<br><a href="' + chatgptUrl + '" target="_blank" rel="noopener noreferrer" class="explain-button">💬 Giải thích bằng ChatGPT</a>';

            const correctLetters = new Set(question.correct_answer.split(''));
            document.querySelectorAll('.option').forEach(function (option) {
                const input = option.querySelector('input');
                option.classList.add('disabled');
                input.disabled = true;
                if (correctLetters.has(input.value)) {
                    option.classList.add('correct');
                } else if (input.checked) {
                    option.classList.add('incorrect');
                }
            });

            document.getElementById('check-button').disabled = true;
        }

        function updateStats() {
            document.getElementById('correct-count').textContent = stats.correct;
            document.getElementById('incorrect-count').textContent = stats.incorrect;
            const total = stats.correct + stats.incorrect;
            document.getElementById('accuracy').textContent =
                (total > 0 ? Math.round((stats.correct / total) * 100) : 0) + '%';
        }

        function randomQuestion() {
            if (questions.length <= 1) return;
            let idx;
            do {
                idx = Math.floor(Math.random() * questions.length);
            } while (idx === currentQuestionIndex);
            currentQuestionIndex = idx;
            displayQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
            if (document.getElementById('quiz-section').style.display === 'none') return;
            if (e.key === 'ArrowRight' && currentQuestionIndex < questions.length - 1) nextQuestion();
            else if (e.key === 'ArrowLeft' && currentQuestionIndex > 0) previousQuestion();
        });
    </script>
</body>
</html>
