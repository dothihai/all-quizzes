<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <!-- Glow for accent shapes -->
    <radialGradient id="glow1" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <!-- Card gradient -->
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <!-- Checkmark gradient -->
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="150" cy="130" rx="180" ry="160" fill="url(#glow1)"/>
  <ellipse cx="370" cy="390" rx="160" ry="140" fill="url(#glow2)"/>

  <!-- Main card / document body -->
  <rect x="108" y="120" width="296" height="300" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Question-mark circle (top accent) -->
  <circle cx="256" cy="196" r="44" fill="none" stroke="rgba(167,139,250,0.9)" stroke-width="5" filter="url(#blur-glow)"/>
  <text x="256" y="213" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#c4b5fd">?</text>

  <!-- Answer option rows -->
  <!-- Row 1 — correct (filled) -->
  <rect x="144" y="270" width="224" height="32" rx="10" fill="rgba(139,92,246,0.35)" stroke="rgba(139,92,246,0.7)" stroke-width="1.5"/>
  <!-- Checkmark on row 1 -->
  <polyline points="156,286 166,296 184,274" fill="none" stroke="url(#check)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Label lines -->
  <rect x="196" y="280" width="112" height="8" rx="4" fill="rgba(255,255,255,0.55)"/>
  <rect x="196" y="292" width="72" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>

  <!-- Row 2 -->
  <rect x="144" y="316" width="224" height="28" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="196" y="326" width="96" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>

  <!-- Row 3 -->
  <rect x="144" y="356" width="224" height="28" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="196" y="366" width="80" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>

  <!-- Bottom progress bar track -->
  <rect x="144" y="398" width="224" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="144" y="398" width="134" height="8" rx="4" fill="url(#check)"/>

  <!-- Top-right sparkle dots -->
  <circle cx="370" cy="148" r="5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="388" cy="132" r="3" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="354" cy="130" r="2.5" fill="#7c3aed" opacity="0.8"/>
</svg>
